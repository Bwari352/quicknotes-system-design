<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>
        Welcome to QuickNotes, your personal note-taking system. Create, edit
        and manage your notes with ease.
      </p>
    </header>
    <main>
      <section>
        <h2>All Notes</h2>
        <button id="load-btn">Load Notes</button>
        <p id="status" role="status" aria-live="polite">
          Click "Load notes" to get notes from the server.
        </p>
      </section>

      <section>
        <h2>Create a Note</h2>
        <form id="note-form">
          <div>
            <label for="title-input">Note title:</label>
            <input
              type="text"
              id="title-input"
              name="title"
              maxlength="100"
              required
            />
          </div>

          <div>
            <label for="body-input">Content:</label>
            <textarea id="body-input" name="body" rows="5"></textarea>
          </div>

          <button id="submit-btn" type="submit">Create Note</button>
        </form>
      </section>

      <section>
        <h2>Your Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
    <script src="api.js" defer></script>
  </body>
</html>
